# 리뷰 컴퓨터 러너(notelink-codex)의 상태를 디스코드로 알립니다 (scripts/runner-status.sh).
# 러너가 멈추면 스스로 알릴 수 없으므로, GitHub 클라우드 러너(ubuntu-latest)에서 GitHub에 러너 상태를 물어봅니다.
# - 15분마다: 상태가 바뀔 때만 알림 (🔴 오프라인 · 🟢 다시 온라인 · 🟡 온라인인데 리뷰가 30분 넘게 대기 · ⚠️ 확인 실패)
#   Codex 사용량도 바뀔 때만 알림 (🟡 남은 양 20% 미만 · ⏸️ 10% 이하 · 한도로 리뷰 멈춤 · ▶️ 초기화되어 다시 시작)
#   다시 시작할 때 멈춘 리뷰 실행(codex-paused-pr-<번호> 결과 파일)을 다시 돌립니다(Re-run). PR 댓글은 남기지 않습니다.
# - 매일 09:00(서울) 무렵: 📋 아침 요약 (지금 상태 · 대기 중인 리뷰 · 지난 24시간 리뷰 결과 · Codex 남은 사용량)
# Codex 사용량은 리뷰 컴퓨터가 리뷰를 마칠 때 올리는 결과 파일(codex-review.yml의 codex-usage)의
# 가장 최근 것을 읽습니다. 멈추는 판단은 리뷰 컴퓨터가 같은 기준(scripts/codex-usage-lib.sh)으로 합니다.
# - 수동 실행(Run workflow): summary를 고르면 아침 요약을 바로 보냅니다(시험 알림용).
# 예약 실행은 기본 브랜치(main)의 이 파일로 돌고, GitHub 사정에 따라 몇 분~수십 분 늦을 수 있습니다.
# 비밀값: DISCORD_RUNNER_WEBHOOK(디스코드 웹후크 주소), RUNNER_STATUS_TOKEN(러너 목록을 읽는 fine-grained PAT,
#   teamNoteLink/NoteLink · Administration: Read-only). GITHUB_TOKEN으로는 러너 목록을 읽을 수 없습니다.
# 지난 상태는 Actions 캐시(runner-status-*)에 둡니다. 캐시가 없으면 처음 확인으로 보고, 온라인이면 알리지 않습니다.
# 공개 저장소는 60일 동안 활동(커밋 등)이 없으면 GitHub가 예약 실행을 끕니다. 그러면 알림도 멈추니
# Actions 탭에서 이 워크플로를 다시 켜야 합니다.
name: 러너 상태 알림

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 0 * * *' # 09:00 서울
  workflow_dispatch:
    inputs:
      mode:
        description: 'summary: 아침 요약을 지금 보냄 / check: 상태 확인(바뀌었을 때만 알림)'
        type: choice
        options: [summary, check]
        default: summary

permissions:
  contents: read
  actions: write # Codex 리뷰 실행 목록 · 결과 파일 읽기, 멈춘 리뷰 다시 돌리기(Re-run) · 멈춤 표시 지우기
  pull-requests: read # 멈춘 PR이 아직 열려 있는지

# 상태 파일(캐시)을 차례로 읽고 쓰도록 check는 한 번에 하나씩 돕니다. 그룹마다 대기 실행은 하나만 남으므로
# 상태를 저장하지 않는 summary는 그룹을 따로 둡니다(00:00 UTC에 check와 함께 떠도 밀려 취소되지 않게).
# 식은 아래 MODE와 같습니다.
concurrency:
  group: runner-status-${{ github.event.schedule == '0 0 * * *' && 'summary' || inputs.mode || 'check' }}
  cancel-in-progress: false

jobs:
  status:
    name: 러너 상태
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODE: ${{ github.event.schedule == '0 0 * * *' && 'summary' || inputs.mode || 'check' }}
      STATE_FILE: .runner-status/state
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      # 가장 최근에 저장한 상태를 받습니다(키 앞부분이 같은 캐시 중 최신).
      - uses: actions/cache/restore@v6
        with:
          path: .runner-status
          key: runner-status-${{ github.run_id }}
          restore-keys: runner-status-

      - name: 확인 · 알림
        id: check
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RUNNER_WEBHOOK }}
        run: scripts/runner-status.sh "$MODE"

      # 상태가 바뀌었을 때만 새 캐시를 만듭니다(바뀌지 않으면 지난 캐시를 계속 씀).
      - if: steps.check.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: .runner-status
          key: runner-status-${{ github.run_id }}-${{ github.run_attempt }}
