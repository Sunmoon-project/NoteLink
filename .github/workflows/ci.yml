# develop · main · design/redesign(디자인 개편 통합 브랜치)으로 가는 PR과 develop · main에 들어온 커밋마다 lint · typecheck · build · test를 돌립니다.
# (기능 브랜치의 push에는 돌리지 않습니다. PR을 열면 PR에서 돌고, 커밋을 더 올리면 다시 돕니다.
#  push와 PR 양쪽에서 같은 커밋을 두 번 검사하던 것을 없앴습니다.)
# scripts/ 의 셸 스크립트는 bats 테스트(scripts/tests)로 검사합니다.
# Dockerfile · compose 파일은 hadolint와 docker compose config로 검사합니다.
# 아직 package.json / requirements-dev.txt / Docker 파일이 없으면 건너뜁니다(건너뛴 것도 통과로 봅니다).
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main, design/redesign]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: 대상 확인
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.check.outputs.node }}
      python: ${{ steps.check.outputs.python }}
      infra: ${{ steps.check.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          [ -f package.json ] && echo "node=true" >> "$GITHUB_OUTPUT" || echo "node=false" >> "$GITHUB_OUTPUT"
          [ -f apps/ai/requirements-dev.txt ] && echo "python=true" >> "$GITHUB_OUTPUT" || echo "python=false" >> "$GITHUB_OUTPUT"
          [ -n "$(git ls-files '*Dockerfile*' '*compose*.yml' '*compose*.yaml')" ] && echo "infra=true" >> "$GITHUB_OUTPUT" || echo "infra=false" >> "$GITHUB_OUTPUT"

  node:
    name: Node (mobile · api · shared)
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Turborepo 캐시 복원
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-node24-
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 루트 명령은 Turborepo(turbo.json)로 돈다. npm ci의 prepare가 @notelink/shared를 미리 빌드하므로 그 결과를 지워,
      # turbo가 shared를 먼저 빌드(^build)하지 않으면 아래 lint가 실패하게 한다(작업 순서 검증)
      - name: shared 빌드 결과 지우기
        run: rm -rf packages/shared/dist
      - name: Lint
        run: npm run lint
      - name: turbo 캐시 확인
        # 방금 돈 lint와 같은 입력이면 캐시가 적중하고(HIT), 루트 eslint 설정(globalDependencies)이 바뀌면 다시 돌아야(MISS) 한다.
        # 실행 계획(--dry)만 보므로 검사를 다시 돌리지 않는다. 스크립트가 없는 워크스페이스(ai의 lint)는 뺀다
        run: |
          status() {
            npx turbo run lint --dry=json | node -e "
              const tasks = JSON.parse(require('fs').readFileSync(0, 'utf8')).tasks
                .filter((t) => t.task === 'lint' && t.command !== '<NONEXISTENT>');
              console.log([...new Set(tasks.map((t) => t.cache.status))].join(','));
            "
          }
          same=$(status)
          echo "같은 입력: $same"
          [ "$same" = "HIT" ] || { echo "::error::같은 입력인데 lint 캐시가 적중하지 않았습니다($same)"; exit 1; }
          echo "// turbo 캐시 확인용" >> eslint.rules.mjs
          changed=$(status)
          git checkout -- eslint.rules.mjs
          echo "루트 eslint 설정 변경 뒤: $changed"
          [ "$changed" = "MISS" ] || { echo "::error::루트 eslint 설정이 바뀌었는데 lint 캐시를 씁니다($changed)"; exit 1; }
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  python:
    name: Python (ai)
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/ai/requirements*.lock
      # 간접 의존성까지 고정한 lock 파일로 설치(#278)
      - run: pip install -r requirements-dev.lock
      - name: Lock 파일 확인
        # requirements*.txt를 바꾸고 lock 파일을 다시 만들지 않았으면 실패(bash apps/ai/lock.sh)
        run: |
          pip install uv==0.13.6
          bash lock.sh --check
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Typecheck
        run: mypy app
      - name: Test
        # 테스트 파일이 아직 없으면 pytest가 5를 돌려주므로 통과로 처리
        run: pytest || [ $? -eq 5 ]

  infra:
    name: Infra (Docker)
    needs: detect
    if: needs.detect.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dockerfile 검사 (hadolint)
        run: |
          git ls-files -z '*Dockerfile*' | while IFS= read -r -d '' f; do
            echo "▶ $f"
            docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --failure-threshold warning - < "$f"
          done
      - name: compose 파일 검사
        # 문법 · 구조만 봅니다. .env 값은 커밋되지 않으므로 변수 치환은 하지 않습니다.
        run: |
          git ls-files -z '*compose*.yml' '*compose*.yaml' | while IFS= read -r -d '' f; do
            echo "▶ $f"
            docker compose -f "$f" config --quiet --no-interpolate
          done

  scripts:
    name: Scripts (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 문법 검사
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Test
        # jq 필터 테스트까지 돌도록 jq 확인 (ubuntu 러너에 기본 설치)
        run: |
          jq --version
          npx --yes bats@1.13.0 scripts/tests

  # 브랜치 규칙의 필수 검사는 이 job 하나만 봅니다.
  ci:
    name: CI 결과
    needs: [detect, node, python, infra, scripts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 결과 확인
        run: |
          echo "detect=${{ needs.detect.result }} node=${{ needs.node.result }} python=${{ needs.python.result }} infra=${{ needs.infra.result }} scripts=${{ needs.scripts.result }}"
          [ "${{ needs.detect.result }}" = "success" ] || exit 1
          [ "${{ needs.scripts.result }}" = "success" ] || exit 1
          for r in "${{ needs.node.result }}" "${{ needs.python.result }}" "${{ needs.infra.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then exit 1; fi
          done
