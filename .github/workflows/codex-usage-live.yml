# 리뷰 컴퓨터 Codex 계정의 지금 남은 사용량(5시간 · 주간)을 디스코드 메시지 하나에 계속 고쳐 보여 줍니다
# (scripts/codex-usage-live.mjs).
# - 사용량은 리뷰 컴퓨터에 로그인한 Codex에서만 읽을 수 있어 리뷰 컴퓨터 러너(self-hosted, codex)에서 돕니다.
#   `codex app-server`의 account/rateLimits/read로 읽어 토큰을 쓰지 않습니다(약 2초).
# - 10분마다 + Codex 리뷰가 끝날 때마다(workflow_run) + 수동 실행(Run workflow).
#   예약 실행 · workflow_run은 기본 브랜치(main)의 이 파일로 돌고, 예약 실행은 GitHub 사정에 따라 늦어질 수 있습니다.
#   수동 실행은 main에서 할 때만 돕니다(다른 브랜치를 골라 누르면 건너뜀).
# - 처음 돌 때 메시지를 새로 올리고, 그 id를 리뷰 컴퓨터의 ~/.notelink/codex-usage-live.json에 둡니다.
#   메시지를 지우면 다음 실행에서 새로 올립니다. 채널에 고정(pin)해 두면 늘 위에서 볼 수 있습니다.
# - 러너가 꺼져 있으면 갱신되지 않습니다(메시지의 확인 시각이 멈춤). 대기 실행은 하나만 남고, 24시간 안에
#   러너가 켜지지 않으면 GitHub가 그 실행을 실패로 끝냅니다.
# - 러너 상태 알림(runner-status.yml)의 리뷰 대기 감시는 Codex 리뷰 워크플로만 세므로 이 실행과 상관없습니다.
# 비밀값: DISCORD_RUNNER_WEBHOOK (러너 상태 알림과 같은 웹후크)
name: Codex 사용량 표시

on:
  schedule:
    - cron: '4-59/10 * * * *'
  workflow_run:
    workflows: [Codex 리뷰]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read # main의 스크립트 파일 받기

jobs:
  show:
    name: Codex 사용량 표시
    # - 수동 실행은 main에서 할 때만 돕니다. 수동 실행은 고른 브랜치의 이 파일로 돌기 때문입니다.
    #   (브랜치에서 이 조건까지 지우고 돌리는 것은 YAML로 막을 수 없으므로, 이 워크플로를 바꾸는 PR은 리뷰에서 확인합니다.)
    # - 건너뛰었거나(초안 · 포크 · Dependabot PR) 취소된(새 커밋에 밀린) 리뷰가 끝날 때는 돌지 않습니다.
    if: >-
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion != 'skipped' && github.event.workflow_run.conclusion != 'cancelled'))
    # 러너가 한 대라 대기 실행이 쌓이지 않게 하나만 남깁니다(새 요청이 오면 기다리던 것을 대신함).
    # job 단위라 위 조건으로 건너뛰는 실행은 그룹에 들어가지 않아, 기다리던 진짜 갱신을 밀어내지 않습니다.
    concurrency:
      group: codex-usage-live
      cancel-in-progress: false
    runs-on: [self-hosted, codex]
    timeout-minutes: 3
    defaults:
      run:
        shell: bash
    steps:
      # checkout을 쓰지 않습니다. 리뷰와 같은 작업 폴더를 쓰므로, 여기서 얕게 · 일부만 받으면 다음 리뷰가
      # 기록 전체를 다시 받아야 합니다. 대신 main의 스크립트 파일 하나만 임시 폴더에 받습니다.
      # 스크립트는 늘 main의 것을 받습니다(검토되지 않은 코드를 리뷰 컴퓨터에서 돌리지 않게).
      - name: 사용량 읽기 · 디스코드 메시지 고치기
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RUNNER_WEBHOOK }}
        run: |
          for c in node codex gh; do
            command -v "$c" > /dev/null || { echo "::error::$c 를 찾을 수 없습니다. 리뷰 컴퓨터의 시스템 PATH를 확인하세요."; exit 1; }
          done
          script="$RUNNER_TEMP/codex-usage-live.mjs"
          gh api "repos/$REPO/contents/scripts/codex-usage-live.mjs?ref=main" \
            -H 'Accept: application/vnd.github.raw' > "$script"
          node "$script"
