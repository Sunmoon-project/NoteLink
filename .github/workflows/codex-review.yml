# develop · main으로 가는 PR에 Codex 리뷰를 남깁니다 (scripts/codex-review.sh).
# Codex 사용량을 아끼려고 자동으로는 첫 리뷰만 합니다.
# - 자동(PR 열림 · 커밋 push · 다시 열림 · Ready for review): 이 계정의 Codex 리뷰가 아직 없을 때만 리뷰합니다.
#   문서(*.md · *.mdx · LICENSE · 루트 docs/의 그림 · PDF, AGENTS.md · CLAUDE.md 제외)만 바뀐 PR은 건너뜁니다.
#   이미 리뷰했으면 CI를 기다리지 않고 바로 끝납니다.
# - 재리뷰는 요청할 때만: PR에 codex-review 라벨을 붙이거나(아래 unlabel job이 바로 떼므로 다시 붙이면 또 요청),
#   PR에 "/codex review"만 쓴 댓글(다음 줄부터는 설명을 써도 됨)을 남기거나, Actions 탭의 Run workflow에 PR 번호를 넣습니다.
#   모두 저장소 쓰기 권한이 있는 사람만 되고, 댓글은 받으면 👀.
# 리뷰 전용 컴퓨터(self-hosted runner, 라벨 codex)에서 돌고, 댓글은 그 컴퓨터의 gh에 로그인한 계정으로 남습니다.
# GITHUB_TOKEN은 넘기지 않습니다. 넘기면 댓글 작성자가 봇이 되어 지난 리뷰를 찾지 못합니다(재리뷰가 깨짐).
# pull_request_target · issue_comment · workflow_dispatch: 이 파일과 스크립트는 PR의 대상 브랜치와 상관없이 기본 브랜치(main)의 것을 씁니다.
# 이 파일이 main에 있어야 develop으로 가는 PR에서도 돌고, 고친 내용도 main에 들어가야 적용됩니다.
# PR이 이 워크플로나 스크립트를 바꿔도 리뷰 컴퓨터에서는 실행되지 않습니다.
# PR 코드(AGENTS.md 포함)는 Codex가 읽기 전용으로 보지만 Codex의 입력이
# 되므로, 리뷰 댓글은 참고용으로 보고 최종 판단은 리뷰어가 합니다.
# 필수 검사가 아니므로 리뷰 컴퓨터가 꺼져 있어도 병합은 막히지 않습니다(그때는 리뷰어가 직접 돌립니다).
name: Codex 리뷰

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [develop, main]
  # 댓글은 대상 브랜치로 거를 수 없어 스크립트가 develop · main인지 확인합니다.
  issue_comment:
    types: [created]
  # 직접 요청(Actions 탭 Run workflow)과, 요청 리뷰 도중 새 커밋이 와서 리뷰 컴퓨터가 다시 요청할 때 씁니다.
  workflow_dispatch:
    inputs:
      pr:
        description: 리뷰할 PR 번호
        required: true
        type: string

permissions:
  contents: read

jobs:
  # codex-review 라벨은 받는 즉시 뗍니다. 리뷰 job이 건너뛰거나(초안 · 닫힌 PR) 취소되거나 실패해도 라벨이 남지 않아,
  # 다음에 다시 붙이면 또 요청이 됩니다(이미 붙은 라벨은 다시 붙여도 이벤트가 생기지 않음).
  # PR 코드는 받지 않고 라벨만 떼므로 GitHub 클라우드 러너에서 GITHUB_TOKEN으로 돕니다(뗀 이벤트는 워크플로를 깨우지 않음).
  unlabel:
    name: 리뷰 요청 라벨 떼기
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'codex-review'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: 라벨 떼기
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api --method DELETE "repos/$REPO/issues/$PR/labels/codex-review" > /dev/null || echo "라벨이 이미 떼어져 있습니다."

  review:
    name: Codex 리뷰
    # 포크 PR(외부인) · 초안 · 닫힌 PR · Dependabot은 건너뜁니다. 라벨은 codex-review만, 댓글은 열린 PR에 단
    # "/codex review"(본문 전체가 명령이거나 명령 바로 뒤에 줄바꿈)만 받습니다. 대소문자는 가리지 않습니다.
    # pull_request_target에는 "외부 기여자 승인" 설정이 적용되지 않으므로 포크는 여기서 막습니다.
    # 댓글 · 직접 요청은 이벤트에 PR 정보가 없어, 포크 · 초안 · Dependabot · 대상 브랜치는 스크립트가 확인합니다.
    # 요청한 사람(라벨을 붙인 사람 · 댓글 쓴 사람 · Run workflow를 누른 사람)의 쓰기 권한도 스크립트가 확인합니다.
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.state == 'open' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       (github.event.action != 'labeled' || github.event.label.name == 'codex-review')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.issue.state == 'open' &&
       github.event.comment.user.type != 'Bot' &&
       (github.event.comment.body == '/codex review' ||
        startsWith(github.event.comment.body, format('/codex review{0}', fromJSON('"\n"'))) ||
        startsWith(github.event.comment.body, format('/codex review{0}', fromJSON('"\r"'))))) ||
      github.event_name == 'workflow_dispatch'
    # 같은 PR에서 자동 실행끼리, 같은 사람의 요청끼리는 앞 실행을 멈추고 마지막 것만 돌립니다.
    # 자동과 요청은 그룹을 나눠, 재리뷰 요청이 뒤이은 push(자동은 이미 리뷰했으면 바로 끝남)에 취소되지 않게 합니다.
    # 요청 그룹에는 요청한 사람을 넣어, 다른 사람의 댓글 · 라벨이 진행 중인 요청을 취소하지 못하게 합니다.
    # 직접 요청(workflow_dispatch)은 실행마다 그룹이 달라, 리뷰 컴퓨터가 다시 요청해도 지금 실행을 취소하지 않습니다.
    # 위 if에서 걸러지는 댓글 · 라벨은 실행마다 따로인 그룹에 넣어, 혹시라도 진행 중인 리뷰를 취소하지 않게 합니다.
    # 거르는 조건(라벨 이름 · 댓글 명령)은 위 if와 같아야 합니다(scripts/tests/codex-review-workflow.bats가 확인).
    concurrency:
      group: >-
        ${{
        ((github.event_name == 'issue_comment' &&
        !(github.event.comment.body == '/codex review' ||
        startsWith(github.event.comment.body, format('/codex review{0}', fromJSON('"\n"'))) ||
        startsWith(github.event.comment.body, format('/codex review{0}', fromJSON('"\r"'))))) ||
        (github.event.action == 'labeled' && github.event.label.name != 'codex-review'))
        && format('codex-review-ignore-{0}', github.run_id)
        || github.event_name == 'workflow_dispatch' && format('codex-review-{0}-dispatch-{1}', inputs.pr, github.run_id)
        || format('codex-review-{0}-{1}', github.event.pull_request.number || github.event.issue.number,
        (github.event_name == 'issue_comment' || github.event.action == 'labeled')
        && format('request-{0}', github.event.comment.user.login || github.event.sender.login) || 'auto')
        }}
      cancel-in-progress: true
    runs-on: [self-hosted, codex]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # 기본 브랜치(main)를 받습니다. 리뷰할 PR과 대상 브랜치는 스크립트가 직접 받습니다.
      # 재리뷰 때 지난 리뷰 커밋과 비교하도록 기록 전체를 받습니다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 리뷰 컴퓨터 확인
        run: |
          # Windows에서 PATH 순서가 바뀌면 Git Bash 대신 WSL · Cygwin bash가 잡힐 수 있습니다.
          # OSTYPE은 Git 버전에 따라 msys 또는 cygwin(2.56.0)이라 쓰지 않고, bash의 루트(/)가
          # Git for Windows 설치 폴더인지(cmd\git.exe가 있는지) 봅니다. WSL · Cygwin 루트에는 없습니다.
          # runner.os는 WSL 안으로 환경 변수가 넘어가지 않아도 되도록 스크립트에 직접 넣습니다.
          if [ "${{ runner.os }}" = "Windows" ] && [ ! -f /cmd/git.exe ]; then
            root=$(cygpath -w / 2> /dev/null || echo "알 수 없음")
            echo "::error::Git Bash가 아닌 bash($OSTYPE, $BASH, 루트 $root)로 실행됐습니다. 시스템 PATH 맨 위에 Git for Windows의 bin(보통 C:\\Program Files\\Git\\bin)을 두세요."
            exit 1
          fi
          for c in git gh codex; do
            command -v "$c" > /dev/null || { echo "::error::$c 를 찾을 수 없습니다. 리뷰 컴퓨터의 시스템 PATH를 확인하세요."; exit 1; }
          done
          login=$(gh api user --jq .login)
          echo "bash  $BASH_VERSION ($(command -v bash))"
          echo "codex $(codex --version) ($(command -v codex))"
          echo "gh    $(gh --version | head -n 1), 로그인: $login"
          codex login status

      # 취소된 지난 실행이 남긴 임시 worktree 기록을 정리합니다.
      - name: 지난 실행 정리
        run: git worktree prune

      - name: 리뷰
        env:
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          # auto: 첫 리뷰만 · 문서만 바뀌면 건너뜀 / request: 라벨 · 댓글 · Run workflow로 요청한 재리뷰 (scripts/codex-review.sh)
          CODEX_TRIGGER: ${{ (github.event_name == 'issue_comment' || github.event_name == 'workflow_dispatch' || github.event.action == 'labeled') && 'request' || 'auto' }}
          CODEX_REQUEST_LABEL: ${{ github.event.action == 'labeled' && github.event.label.name || '' }}
          # 요청한 사람: 댓글이면 쓴 사람, 라벨이면 붙인 사람, Run workflow면 누른 사람.
          # 이벤트 값은 env로만 넘깁니다(명령 주입 방지)
          CODEX_REQUESTER: ${{ github.event.comment.user.login || github.event.sender.login }}
          CODEX_REQUEST_COMMENT: ${{ github.event.comment.id }}
          CODEX_REQUEST_BODY: ${{ github.event.comment.body }}
          # 스크립트의 임시 폴더(mktemp)를 러너 작업용 임시 폴더에 둡니다. 러너가 작업마다 비우므로
          # 취소된 실행이 남긴 폴더도 쌓이지 않습니다.
          TMPDIR: ${{ runner.temp }}
          # Codex 실행 뒤 남은 사용량을 적을 파일 (다음 단계에서 올림). 이 컴퓨터에는 마지막 기록이
          # ~/.notelink-codex-usage로 남고, 남은 양이 10% 이하이거나 한도에 걸렸으면 Codex를 돌리지 않습니다.
          # 그때는 PR 댓글 없이 이 실행 화면에 ⏸️ 경고만 남기고, 멈춘 PR을 CODEX_PAUSED_FILE에 적습니다.
          CODEX_USAGE_FILE: ${{ runner.temp }}/codex-usage.txt
          CODEX_PAUSED_FILE: ${{ runner.temp }}/codex-paused.txt
        run: scripts/codex-review.sh "$PR"

      # 남은 사용량을 러너 상태 알림(runner-status.yml)이 읽도록 결과 파일로 올립니다.
      # 한도에 걸려 리뷰가 실패해도 올립니다. CI 실패 · 이미 리뷰함 등으로 Codex를 돌리지 않았으면 파일이 없어 건너뜁니다.
      # 사용률 · 초기화 시각 · 플랜 이름만 들어 있습니다(공개 저장소라 로그인한 누구나 받을 수 있음).
      # 다시 돌린 실행(Re-run)이 같은 이름으로 다시 올릴 수 있도록 overwrite합니다.
      - name: Codex 사용량 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-usage
          path: ${{ runner.temp }}/codex-usage.txt
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

      # 사용량 때문에 리뷰를 멈췄으면 PR 번호 · 다시 가능한 시각을 담은 결과 파일(codex-paused)을 올립니다.
      # 러너 상태 알림이 15분마다 이 이름으로 찾아, 그 시각이 지난 것을 다시 돌리고(Re-run) 이 결과 파일을 지웁니다.
      # 주간 한도로 최대 7일 멈출 수 있어 10일 보관합니다.
      - name: 멈춘 리뷰 표시 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-paused
          path: ${{ runner.temp }}/codex-paused.txt
          if-no-files-found: ignore
          overwrite: true
          retention-days: 10
