# main에 들어온 커밋(develop → main 릴리스)을 Azure App Service(개발 환경)에 배포합니다(#363). Actions 탭에서 main으로 직접 실행할 수도 있습니다.
# develop · main으로 가는 PR에서는 배포 묶음 만들기 · 확인까지만 돌리고 Azure에는 올리지 않습니다.
# 다른 브랜치에서 직접 실행하면 배포 작업을 건너뜁니다(검토 전 코드가 올라가지 않게).
#   - API 서버(apps/api)  → notelink-api-dev (Node 24)
#   - AI 서버(apps/ai)    → notelink-ai-dev  (Python 3.13)
# Azure 로그인은 비밀값 없이 OIDC로 합니다. 저장소 Variables에 AZURE_CLIENT_ID · AZURE_TENANT_ID ·
# AZURE_SUBSCRIPTION_ID가 모두 있어야 하고, 하나라도 없으면 배포를 건너뜁니다.
# 환경 변수(앱 설정)와 비밀값은 여기서 다루지 않습니다. App Service 앱 설정 · Key Vault에 둡니다.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/ai/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'scripts/wait-http-ok.sh'
      - 'scripts/webapp-deploy.sh'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [develop, main]
    paths: # push와 같게 둡니다
      - 'apps/api/**'
      - 'apps/ai/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'scripts/wait-http-ok.sh'
      - 'scripts/webapp-deploy.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 배포가 겹치지 않게 차례로 돌립니다. 진행 중인 배포는 끊지 않습니다.
# PR 확인은 PR마다 따로 돌고, 새 커밋이 오면 앞의 것을 끊습니다.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-check-{0}', github.ref) || 'deploy-dev' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write # Azure OIDC 로그인

env:
  RESOURCE_GROUP: rg-notelink-dev
  API_APP: notelink-api-dev
  AI_APP: notelink-ai-dev

jobs:
  api:
    name: API 서버 (NestJS)
    if: >-
      github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' &&
      vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build -w packages/shared -w apps/api
      - name: 운영 의존성만 다시 설치
        # 앱(mobile) 패키지와 개발 의존성을 빼고 lock 파일 버전 그대로 설치
        run: |
          rm -rf node_modules apps/*/node_modules packages/*/node_modules
          npm ci --omit=dev --ignore-scripts -w apps/api -w packages/shared
      - name: 배포 묶음 만들기
        # 저장소와 같은 폴더 구조로 묶어 의존성 찾는 경로가 바뀌지 않게 합니다.
        # @notelink/shared는 작업 공간 링크라 빌드 결과를 직접 복사합니다.
        run: |
          mkdir -p deploy/apps/api deploy/node_modules
          cp -r node_modules/. deploy/node_modules/
          rm -rf deploy/node_modules/@notelink
          mkdir -p deploy/node_modules/@notelink/shared
          cp packages/shared/package.json deploy/node_modules/@notelink/shared/
          cp -r packages/shared/dist deploy/node_modules/@notelink/shared/dist
          if [ -d packages/shared/node_modules ]; then
            cp -r packages/shared/node_modules deploy/node_modules/@notelink/shared/node_modules
          fi
          cp apps/api/package.json deploy/apps/api/
          cp -r apps/api/dist deploy/apps/api/dist
          if [ -d apps/api/node_modules ]; then
            cp -r apps/api/node_modules deploy/apps/api/node_modules
          fi
      - name: 배포 묶음 확인
        # 운영 의존성이 모두 찾아지는지, bcrypt 네이티브 모듈이 열리는지 확인.
        # main.js가 불러오는 서버 코드(reflect-metadata → app.module · app.setup)도 그대로 불러옵니다.
        # 타입만 쓰는 이름을 값으로 import하면 테스트(SWC)는 지나가도 실제 서버는 시작하자마자
        # 꺼지므로 여기서 잡습니다(#384). 불러오기만 하고 서버는 띄우지 않아 환경 변수가 없어도 됩니다.
        working-directory: deploy/apps/api
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
            for (const name of [...Object.keys(pkg.dependencies), '@notelink/shared']) {
              import.meta.resolve(name);
            }
            await import('bcrypt');
            await import('@notelink/shared');
            await import('reflect-metadata');
            await import('./dist/app.module.js');
            await import('./dist/app.setup.js');
          "
      - name: 압축
        run: |
          du -sh deploy/node_modules
          cd deploy && zip -qr ../api.zip .
      - uses: azure/login@v3
        if: github.event_name != 'pull_request'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: 배포
        if: github.event_name != 'pull_request'
        run: az webapp deploy --resource-group "$RESOURCE_GROUP" --name "$API_APP" --src-path api.zip --type zip
      - name: 응답 확인
        if: github.event_name != 'pull_request'
        # 새 버전이 뜰 때까지 최대 5분 기다립니다.
        run: |
          host=$(az webapp show --resource-group "$RESOURCE_GROUP" --name "$API_APP" --query defaultHostName -o tsv)
          bash scripts/wait-http-ok.sh "https://$host/api/v1/health" 30 10

  ai:
    name: AI 서버 (FastAPI)
    if: >-
      github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' &&
      vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '')
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 배포 확인(scripts/webapp-deploy.sh, 최대 30분)과 설치 · 묶음 확인을 합쳐 작업 전체에 상한을 둡니다
    steps:
      - uses: actions/checkout@v7
      - name: 배포 묶음 만들기
        # 패키지는 App Service가 배포 때 설치합니다(SCM_DO_BUILD_DURING_DEPLOYMENT=true).
        # 간접 의존성까지 고정한 lock 파일을 requirements.txt 자리에 넣습니다.
        run: |
          mkdir deploy
          cp -r apps/ai/app deploy/app
          cp apps/ai/requirements.lock deploy/requirements.txt
          cd deploy && zip -qr ../ai.zip .
      - uses: actions/setup-python@v7
        with:
          python-version-file: apps/ai/.python-version
          cache: pip
          cache-dependency-path: apps/ai/requirements.lock
      - name: 배포 묶음 확인
        # App Service처럼 묶음(ai.zip)의 requirements.txt(운영 lock)만 깨끗한 가상환경에 설치하고,
        # 묶음 안의 웹 서버(app.main)와 작업 처리기(app.worker.__main__ → 처리 함수 · 서비스 전체)
        # 코드를 불러옵니다. 개발 의존성(requirements-dev)에만 있는 패키지를 쓰거나 묶음에 파일이
        # 빠지면, main 병합 뒤 배포에서가 아니라 PR에서 실패합니다. 불러오기만 하고 서버 · 처리기는
        # 띄우지 않아 환경 변수 · DB가 없어도 됩니다(설정은 모두 기본값이 있음).
        # 함수 안에서 처음 쓸 때 불러오는 패키지는 위 import로 열리지 않아 따로 불러옵니다: 노트 용어
        # 분석(app/services/note/terms.py _kiwi)의 kiwipiepy(네이티브 모듈, Codex 리뷰 #390).
        # 그런 import를 더하면 여기에도 적습니다.
        run: |
          mkdir /tmp/ai-bundle
          unzip -q ai.zip -d /tmp/ai-bundle
          python -m venv /tmp/ai-venv
          /tmp/ai-venv/bin/pip install --quiet -r /tmp/ai-bundle/requirements.txt
          cd /tmp/ai-bundle
          /tmp/ai-venv/bin/python -c "import uvicorn, app.main, app.worker.__main__, kiwipiepy"
      - uses: azure/login@v3
        if: github.event_name != 'pull_request'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: 배포
        if: github.event_name != 'pull_request'
        # App Service가 배포 때 패키지를 설치하느라 몇 분 걸려서, 끝까지 붙잡고 기다리면 앞단 응답 한도(약 4분)에 걸려
        # 504로 끊긴다. OneDeploy 비동기 배포로 시작하고, 이 배포의 id로 Azure 배포 상태 API를 최대 30분 확인해
        # 패키지 설치(BuildFailed)와 앱 시작(RuntimeSuccessful · RuntimeFailed)까지 판정한다(scripts/webapp-deploy.sh).
        # AI 서버는 API 서버 IP만 받으므로 주소(헬스 체크)로는 확인하지 못한다.
        run: bash scripts/webapp-deploy.sh "$RESOURCE_GROUP" "$AI_APP" ai.zip 1800 20
