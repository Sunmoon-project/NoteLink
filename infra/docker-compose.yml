name: notelink

services:
  mongodb:
    image: mongodb/mongodb-atlas-local:8.0.32
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGODB_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    command: ["azurite", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0", "--skipApiVersionCheck"]

volumes:
  mongodb_data:
  mongodb_config:
  azurite_data:
